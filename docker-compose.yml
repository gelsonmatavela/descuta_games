services:
  db:
    image: postgres:16-alpine
    container_name: rage_games_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rage
      POSTGRES_PASSWORD: rage
      POSTGRES_DB: rage_games
    ports:
      - "5432:5432"
    volumes:
      - rage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rage -d rage_games"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rage_pgdata:
